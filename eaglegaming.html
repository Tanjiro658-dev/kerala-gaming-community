
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Gaming | Kerala Gaming Community</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #ffffff;
        }

        nav {
            padding: 18px 8%;
            background: #0b1220;
            border-bottom: 1px solid #26364a;
        }

        nav a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: bold;
        }

        .profile {
            width: min(700px, 90%);
            margin: 70px auto;
            padding: 35px 25px;
            text-align: center;
            background: #172338;
            border: 1px solid #26364a;
            border-radius: 18px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #00e5ff;
            color: #101827;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 10px;
            color: #00e5ff;
        }

        .description {
            color: #c5d0df;
            line-height: 1.7;
        }

        .tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
        }

        .tag {
            padding: 8px 14px;
            background: #24354b;
            border-radius: 20px;
            color: #7cfc98;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .youtube {
            background: #ff4545;
            color: white;
        }

        .kick {
            background: #53d769;
            color: #101827;
        }

        .home {
            display: inline-block;
            margin-top: 30px;
            color: #00e5ff;
            text-decoration: none;
        }

        a:hover {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .profile {
                margin: 35px auto;
                padding: 28px 16px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">← Kerala Gaming Community</a>
    </nav>

    <main class="profile">
        <div class="avatar">EG</div>

        <h1>Eagle Gaming</h1>

        <p class="description">
            Gaming creator in the Kerala Gaming Community.
            Explore the channel and follow the gaming content!
        </p>

        <div class="tags">
            <span class="tag">PUBG / BGMI</span>
            <span class="tag">GTA V</span>
        </div>

        <div class="buttons">
            <a class="btn youtube"
               href="https://www.youtube.com/@eaglegamingop"
               target="_blank"
               rel="noopener noreferrer">
                YouTube Channel
            </a>

            <a class="btn kick"
               href="https://kick.com/eaglegaming"
               target="_blank"
               rel="noopener noreferrer">
                Kick Livestream
            </a>
        </div>

        <a class="home" href="index.html">
            Back to Home
        </a>
    </main>
</body>
</html>
